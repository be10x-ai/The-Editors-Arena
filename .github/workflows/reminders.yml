name: Drain reminder queue

# Vercel's Hobby plan allows one cron run per day, which is too coarse for the
# 1-hour-before-start reminder. vercel.json keeps a daily run as a safety net;
# this workflow drives the fine-grained schedule for free.
#
# Requires two repository secrets (Settings -> Secrets and variables -> Actions):
#   APP_URL      e.g. https://the-editors-arena.vercel.app   (no trailing slash)
#   CRON_SECRET  the same value set in the Vercel project's env vars
#
# GitHub does not guarantee punctual scheduled runs — under load a tick can be
# delayed by several minutes. The endpoint only sends reminders whose due time
# has passed, so a late run sends late, never twice.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the reminder endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET is not set on this repository." >&2
            exit 1
          fi
          # Keep the body out of the log on failure: it is not sensitive, but the
          # Authorization header must never be echoed.
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/reminders")
          echo "HTTP $code"
          cat /tmp/out.json
          echo
          [ "$code" = "200" ]
