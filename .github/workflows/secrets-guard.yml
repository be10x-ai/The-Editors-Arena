name: Secrets guard

# A .env carrying live credentials reached this repo more than ten times, and
# every fix that relied on .gitignore failed for the same reason: .gitignore only
# governs `git add`. Uploading a file through github.com's web interface writes
# the blob directly, so "Add files via upload" re-committed the secrets no matter
# how many times the file was untracked locally.
#
# This runs server-side, after the fact, on whatever actually landed — the only
# vantage point that sees a web upload at all. It cannot block the push (that
# needs GitHub Secret Protection, a paid add-on on private repos), but it turns a
# silent leak into a red X within a minute of the commit.
#
# On a hit, the fix is never "delete the file and move on". Anything that reached
# the remote must be rotated: rewriting history does not recall what was already
# fetched, and orphaned commits stay readable at their SHA until GitHub's own
# garbage collection runs.

on:
  push:
  pull_request:

# Cancel superseded runs: on a fast series of pushes only the tip matters.
concurrency:
  group: secrets-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Checks the committed tree rather than the diff, so a file added before
      # this workflow existed is still caught, and so does not depend on being
      # able to resolve a base commit — a force-push leaves nothing to diff
      # against, and a force-push is exactly what follows a leak cleanup.
      - name: Is a real .env committed?
        run: |
          # .env.example is the documented template and holds no values.
          tracked=$(git ls-files -- '.env' '.env.*' ':!:.env.example' || true)

          if [ -z "$tracked" ]; then
            echo "No .env files tracked."
            exit 0
          fi

          echo "::error::Committed environment file(s): $tracked"
          {
            echo "### A .env file is committed"
            echo
            echo '```'
            echo "$tracked"
            echo '```'
            echo
            echo "**Treat every value in it as compromised.** Rotate first, clean second:"
            echo
            echo "1. Supabase → Settings → Database → reset password"
            echo "2. Supabase → Settings → API → roll the \`service_role\` key"
            echo "3. \`CRON_SECRET\` → \`openssl rand -hex 24\`"
            echo "4. The SMTP mailbox password, at the mail host"
            echo "5. Update Vercel → Settings → Environment Variables"
            echo
            echo "Then remove it from history — \`git rm --cached\` alone leaves the blob"
            echo "readable in every earlier commit:"
            echo
            echo '```bash'
            echo "git filter-repo --path <file> --invert-paths --force"
            echo "git push --force origin main"
            echo '```'
            echo
            echo "Uploading env files through the GitHub web UI bypasses .gitignore."
            echo "Put values in Vercel's environment variables instead — never in the repo."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # A second net, for values pasted into ordinary source files where no
      # filename hints at them. Two shapes only — a credentialed Postgres URL and
      # a JWT — because a check that cries wolf gets ignored, and then it is worse
      # than no check. Matching the word "service_role" flagged a help string in
      # scripts/ensure-avatar-bucket.ts; the token's own shape does not.
      - name: Any credential-shaped literals outside .env.example?
        run: |
          hits=$(git grep -nIE \
            "(postgresql|postgres)://[^:[:space:]\"']+:[^@[:space:]\"']+@|eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}" \
            -- ':!:.env.example' ':!:.github/workflows/secrets-guard.yml' ':!:*.md' || true)

          if [ -z "$hits" ]; then
            echo "No credential-shaped literals found."
            exit 0
          fi

          echo "::error::Possible hardcoded credentials:"
          echo "$hits"
          {
            echo "### Possible hardcoded credentials"
            echo
            echo '```'
            echo "$hits"
            echo '```'
            echo
            echo "Read these from \`process.env\` instead. If a match is a placeholder,"
            echo "make it obviously fake (\`postgresql://user:pass@host/db\`)."
            echo
            echo "A JWT here is a pasted Supabase key. The anon key is safe to publish"
            echo "but still belongs in an env var; the \`service_role\` key bypasses RLS"
            echo "entirely and must be rotated if it ever reached the remote."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
